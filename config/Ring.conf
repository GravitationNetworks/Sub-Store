#!name=Sub-Store
#!desc=基于 feat/ring-adapter 分支的高级订阅管理工具，专为 Ring App 适配。
#!openUrl=https://sub.store
#!author=Peng-YM
#!homepage=https://github.com/GravitationNetworks/Sub-Store/tree/feat/ring-adapter

# ------------------------------------------------------------------------------
# 1. HTTPS 解密配置 (MITM)
# ------------------------------------------------------------------------------
[MITM]
hostname = %APPEND% sub.store

# ------------------------------------------------------------------------------
# 2. 脚本拦截与调度 (Script)
# ------------------------------------------------------------------------------
[Script]
# [选项 A - 本地路径模式] 适用于本机开发与即时联调测试（无需依赖远程 CDN）：
Sub-Store-Core = type=http-request, pattern=^https?:\/\/sub\.store\/((download)|api\/(preview|sync|(utils\/node-info))), script-path=/Users/frost/codes/orvaxis/gravitation/Sub-Store/backend/dist/sub-store-1.min.js, requires-body=true, timeout=120, max-size=-1, argument="cors=https://sub-store.vercel.app,http://substore.stash,https://substore.stash"
Sub-Store-Simple = type=http-request, pattern=^https?:\/\/sub\.store, script-path=/Users/frost/codes/orvaxis/gravitation/Sub-Store/backend/dist/sub-store-0.min.js, requires-body=true, timeout=120, max-size=-1, argument="cors=https://sub-store.vercel.app,http://substore.stash,https://substore.stash"
Sub-Store-Sync = type=cron, cronexp="55 23 * * *", script-path=/Users/frost/codes/orvaxis/gravitation/Sub-Store/backend/dist/cron-sync-artifacts.min.js, timeout=120, argument="sync_success_notify=true"

# [选项 B - 远程分支模式] 适用于跨设备（如 iOS / 外部网络）测试：
# Sub-Store-Core = type=http-request, pattern=^https?:\/\/sub\.store\/((download)|api\/(preview|sync|(utils\/node-info))), script-path=https://raw.githubusercontent.com/GravitationNetworks/Sub-Store/feat/ring-adapter/backend/dist/sub-store-1.min.js, requires-body=true, timeout=120, max-size=-1, argument="cors=https://sub-store.vercel.app,http://substore.stash,https://substore.stash"
# Sub-Store-Simple = type=http-request, pattern=^https?:\/\/sub\.store, script-path=https://raw.githubusercontent.com/GravitationNetworks/Sub-Store/feat/ring-adapter/backend/dist/sub-store-0.min.js, requires-body=true, timeout=120, max-size=-1, argument="cors=https://sub-store.vercel.app,http://substore.stash,https://substore.stash"
# Sub-Store-Sync = type=cron, cronexp="55 23 * * *", script-path=https://raw.githubusercontent.com/GravitationNetworks/Sub-Store/feat/ring-adapter/backend/dist/cron-sync-artifacts.min.js, timeout=120, argument="sync_success_notify=true"
